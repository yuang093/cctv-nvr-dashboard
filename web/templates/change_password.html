<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>強制變更密碼 - NVR Dashboard</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 360px; margin: 80px auto; padding: 0 20px; }
  h1 { font-size: 1.4em; }
  .flash { padding: 8px 12px; margin: 12px 0; border-radius: 4px; }
  .flash.error { background: #fee; color: #c00; }
  .flash.success { background: #efe; color: #0a0; }
  label { display: block; margin-top: 12px; }
  input { width: 100%; padding: 8px; box-sizing: border-box; margin-top: 4px; }
  button { margin-top: 16px; padding: 10px 20px; cursor: pointer; }
</style>
</head>
<body>
<h1>首次登入強制變更密碼</h1>
<p>為了帳號安全，首次登入後必須變更密碼。</p>
{% with messages = get_flashed_messages(with_categories=true) %}
  {% for category, message in messages %}
    <div class="flash {{ category }}">{{ message }}</div>
  {% endfor %}
{% endwith %}
<form method="post">
  <label>新密碼（至少 8 字元）：
    <input name="new_password" type="password" required minlength="8">
  </label>
  <button type="submit">更新密碼</button>
</form>
</body>
</html>
