name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:  # 允許手動觸發

jobs:
  pytest:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-web.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify pre-bundled SSL cert (no openssl CLI required)
        run: |
          ls -l tests/fixtures/cert.pem tests/fixtures/key.pem

      - name: Run pytest (unit + integration, 744 tests)
        run: |
          pytest -q

  mypy:
    # Week 7 Issue #020 — mypy 型別檢查（警告期：Task 1-7 用 || true 不擋 PR）
    # Task 8 啟用 --strict 後改為 fail-on-error。
    name: mypy (warning only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-web.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run mypy (warning period)
        run: |
          # 警告期：|| true 不擋 PR merge；數據透過 GitHub Actions summary 收集
          python -m mypy || true
